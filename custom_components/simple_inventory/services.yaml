add_item:
  fields:
    inventory_id:
      example: "01JYFPCDMBRBRK4MB3C26S2FKH"
      required: false
      selector:
        text:
    inventory_name:
      example: "Disposable Goods"
      required: false
      selector:
        text:
    name:
      example: "Frozen Pizza"
      required: true
      selector:
        text:
    icon:
      example: "mdi:pizza"
      required: false
      selector:
        icon:
    barcode:
      example: "012345678901"
      required: false
      default: ""
      selector:
        text:
    aliases:
      example: "oats, steel-cut oats, hot cereal"
      required: false
      default: ""
      selector:
        text:
    quantity:
      example: 2.5
      required: false
      default: 1
      selector:
        number:
          min: 0
          step: 0.1
    unit:
      example: "boxes"
      required: false
      default: ""
      selector:
        text:
    price:
      example: 4.99
      required: false
      default: 0
      selector:
        number:
          min: 0
          step: 0.01
    category:
      example: "Prepared Foods, Frozen"
      required: false
      default: ""
      selector:
        text:
    expiry_date:
      example: "2025-12-31"
      required: false
      default: ""
      selector:
        date:
    expiry_alert_days:
      example: 7
      required: false
      default: 0
      selector:
        number:
          min: 0
    auto_add_enabled:
      example: true
      required: false
      default: false
      selector:
        boolean:
    auto_add_to_list_quantity:
      example: 1
      required: false
      default: 0
      selector:
        number:
          min: 0
    desired_quantity:
      example: 10
      required: false
      default: 0
      selector:
        number:
          min: 0
    todo_list:
      example: "todo.grocery_list"
      required: false
      default: ""
      selector:
        entity:
          domain: todo
    location:
      example: "Basement Refrigerator, Kitchen Pantry"
      required: false
      default: ""
      selector:
        text:
    description:
      example: "Junk food"
      required: false
      default: ""
      selector:
        text:
          multiline: true
    auto_add_id_to_description_enabled:
      example: true
      required: false
      default: false
      selector:
        boolean:
    todo_quantity_placement:
      example: "description"
      required: false
      default: "name"
      selector:
        select:
          options:
            - "name"
            - "description"
            - "none"

